<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="Fifteen classic card games in your browser — Klondike, FreeCell, Spider, Blackjack, Daifugo and more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Talonbox" />
    <meta
      property="og:description"
      content="Fifteen classic card games in your browser — solitaire, casino and table games against the computer."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Talonbox</title>
    <script>
      // Pick the theme before first paint so the page never flashes the wrong colours.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('talonbox:theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3eee3');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
